<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pszichológia órák – 10. osztály</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FB; --ink:#16163A; --muted:#4F5279; --card:#FFFFFF; --line:#D5D8EE;
  --accent:#D42A68; --blue:#3550F5; --teal:#0B7F72;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.home{min-height:100%;padding:clamp(24px,6vw,64px)}
.home[hidden]{display:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3rem);margin:0 0 .3em;letter-spacing:-.02em}
p.lead{color:var(--muted);max-width:60ch;font-size:1.1rem;margin:0 0 2em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:960px}
button.card{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px 26px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s;cursor:pointer;font-family:inherit}
button.card:hover{transform:translateY(-3px);border-color:var(--accent)}
button.card .n{display:inline-block;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--accent);margin-bottom:.5em}
button.card h2{font-family:var(--display);font-size:1.4rem;margin:0 0 .3em}
button.card p{margin:0;color:var(--muted);font-size:.95rem}

.lessonwrap{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.lessonwrap[hidden]{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
.backbtn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.5em 1.1em;cursor:pointer;font-weight:700;font-family:inherit;font-size:.95rem}
.backbtn:hover{border-color:var(--accent)}
.lessonwrap iframe{flex:1;width:100%;border:0}
</style>
</head>
<body>

<div class="home" id="home">
  <h1>Pszichológia órák</h1>
  <p class="lead">Interaktív, kattintható diasorok – 10. osztály. Válaszd ki az órát.</p>
  <div class="grid">
    <button class="card" data-lesson="bevezeto">
      <span class="n">1. ÓRA</span>
      <h2>Mi zajlik a fejedben?</h2>
      <p>Bevezetés a pszichológiába</p>
    </button>
    <button class="card" data-lesson="erzekeles">
      <span class="n">2. ÓRA</span>
      <h2>Érzékelés</h2>
      <p>Hogyan jut el a világ az agyunkig</p>
    </button>
    <button class="card" data-lesson="eszleles">
      <span class="n">3. ÓRA</span>
      <h2>Észlelés</h2>
      <p>Érzékelés vs. észlelés, Gestalt-elvek</p>
    </button>
  </div>
</div>

<div class="lessonwrap" id="lessonwrap" hidden>
  <div class="topbar">
    <button class="backbtn" id="backbtn">← Vissza a főoldalra</button>
  </div>
  <iframe id="lessonframe" title="Lecke"></iframe>
</div>

<script>
const LESSONS = {
  bevezeto: `<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi zajlik a fejedben? – Bevezetés a pszichológiába</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FB; --ink:#16163A; --muted:#4F5279; --card:#FFFFFF; --line:#D5D8EE;
  --accent:#D42A68; --blue:#3550F5; --teal:#0B7F72; --sun:#FFC533; --sun-ink:#33240A;
  --good:#0B7A4E; --bad:#B8263F;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;

@media (prefers-color-scheme: dark){

    --accent:#FF5C93; --blue:#6F86FF; --teal:#2CC7B4; --sun:#FFC533; --sun-ink:#33240A;
    --good:#4BD99A; --bad:#FF7A90;
  }
}
:root[data-theme="dark"]{
  --bg:#12122B; --ink:#EEEFFC; --muted:#A9ACD6; --card:#1D1E42; --line:#34376B;
  --accent:#FF5C93; --blue:#6F86FF; --teal:#2CC7B4; --sun:#FFC533; --sun-ink:#33240A;
  --good:#4BD99A; --bad:#FF7A90;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1.02rem,1.5vw,1.28rem);line-height:1.5;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.06;margin:0 0 .45em}
h1{font-size:clamp(2.6rem,7.5vw,5.6rem)}
h2{font-size:clamp(1.9rem,4.2vw,3.2rem)}
h3{font-size:clamp(1.15rem,2vw,1.5rem);font-weight:600;letter-spacing:-.01em}
h1:focus,h2:focus{outline:none}
p{margin:0 0 .8em}
.lead{color:var(--muted);max-width:58ch;font-size:1.08em}
.small{font-size:.86em;color:var(--muted)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.deck{height:100%;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;display:flex;padding:clamp(18px,3.5vw,48px) clamp(18px,6vw,88px)}
.slide[hidden]{display:none!important}
.slide-inner{width:100%;max-width:1120px;margin:auto}

/* nav bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,32px);border-top:1px solid var(--line);background:var(--bg)}
.nav{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:22px;height:22px}
.track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;min-width:4.2em;text-align:right}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.5em 1em;min-height:46px;cursor:pointer;font-weight:500;flex:none}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* buttons */
.btn{font-weight:700;padding:.7em 1.35em;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;min-height:46px;font-size:1rem}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.picked{background:var(--ink);color:var(--bg)}

/* notes */
.notes{display:none;margin-top:1.6em;padding:14px 18px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.9rem}
.notes b{color:var(--ink)}
body.notes-on .notes{display:block}

/* grids and cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px}
.card h3{margin-bottom:.3em}
.card p{margin:0;color:var(--muted)}

/* flip cards */
.flip{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;min-height:132px;cursor:pointer}
.flip .back{display:none}
.flip.is-open{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flip.is-open .front{display:none}
.flip.is-open .back{display:block}
.flip .hint{display:block;margin-top:.7em;font-size:.82em;color:var(--muted)}
.flip .t{font-family:var(--display);font-weight:600;font-size:1.25em;line-height:1.2;display:block}
.flip .back b{display:block;font-family:var(--display);font-size:1.2em;margin-bottom:.25em}

/* slide 1 */
.hero{display:grid;gap:32px;align-items:center}
@media (min-width:900px){.hero{grid-template-columns:1.05fr .95fr}}
.cloud{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:center;justify-content:center}
.chip{display:inline-block;padding:.45em 1em;border-radius:999px;font-weight:700;font-size:var(--s,1.1rem);transform:rotate(var(--r,0deg));animation:rise .7s both;animation-delay:var(--d,0s);border:2px solid transparent}
.c1{background:var(--accent);color:#fff}
.c2{background:var(--blue);color:#fff}
.c3{background:var(--teal);color:#fff}
.c4{background:var(--sun);color:var(--sun-ink)}
.c5{border-color:var(--ink);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(28px) rotate(var(--r,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}

/* slide 2 */
.stmt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stmt.ok{border-color:var(--good);border-width:2.5px}
.stmt.no{border-color:var(--bad);border-width:2.5px}
.stmt-t{font-weight:700;margin:0;font-size:1.05em}
.ans{display:flex;gap:10px}
.fb{margin:0;font-size:.95em;color:var(--muted)}
.stmt.ok .fb strong{color:var(--good)}
.stmt.no .fb strong{color:var(--bad)}
.score{margin:16px 0 0;font-weight:700;min-height:1.6em}

/* stroop + drm dark panel */
.panel{background:#1A1A2E;color:#F2F3FF;border-radius:24px;min-height:260px;display:grid;place-items:center;padding:24px;text-align:center}
.panel p{color:#DADCF5}
.panel .btn.light{background:#F2F3FF;color:#1A1A2E;border-color:#F2F3FF}
.st-word{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,11vw,7rem);letter-spacing:.02em}
.st-msg{max-width:52ch}
.res{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.res b{display:block;font-family:var(--display);font-size:clamp(2rem,5vw,3.2rem)}
.res span{font-size:.9rem;color:#C7CAF0}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.swatches{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px}
.sw{background:none;border:none;color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:4px;padding:6px;border-radius:16px;min-width:76px}
.sw:disabled{opacity:.45;cursor:default}
.sw .dot{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink)}
.sw .lab{font-weight:500;font-size:.9rem}
.status{color:var(--muted);margin:0 0 8px;min-height:1.5em;font-weight:500}

.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.words .w{background:#F2F3FF;color:#1A1A2E;border-radius:12px;padding:.35em .9em;font-weight:700;font-size:1.15em}
.big-count{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--sun)}

/* slide 4 iceberg */
.water{display:grid;gap:0;border-radius:22px;overflow:hidden;border:1.5px solid var(--line)}
.above{background:var(--card);padding:20px 22px}
.below{background:#1F2F73;color:#EAF0FF;padding:20px 22px;position:relative}
.below .hid{filter:blur(9px);transition:filter .5s;user-select:none}
.below.open .hid{filter:none;user-select:auto}
.below .go{position:absolute;inset:0;display:grid;place-items:center}
.below.open .go{display:none}
.line-water{height:6px;background:repeating-linear-gradient(90deg,#5A78FF 0 14px,#3D57D6 14px 28px)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{border-radius:999px;padding:.25em .85em;font-weight:500;font-size:.95em;border:1.5px solid currentColor}
.ety{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 20px}
.ety div{font-family:var(--display);font-weight:600;font-size:1.3em}
.ety small{display:block;font-family:var(--body);font-weight:400;font-size:.65em;color:var(--muted)}
.two-col{display:grid;gap:28px;align-items:start}
@media (min-width:900px){.two-col{grid-template-columns:1fr 1fr}}
.def{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.2;letter-spacing:-.01em;margin:0 0 .6em}

/* slide 10 */
.pick{display:block;text-align:left;width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer}
.pick b{font-family:var(--display);font-size:1.2em;display:block;margin-bottom:.15em}
.pick span{color:var(--muted);font-size:.95em}
.pick[aria-pressed="true"]{border-color:var(--accent);border-width:2.5px;background:var(--card);box-shadow:inset 6px 0 0 var(--accent)}
.pickmsg{font-weight:700;margin:16px 0 0;min-height:1.6em}

.box{border-left:6px solid var(--sun);background:var(--card);border-radius:0 16px 16px 0;padding:16px 20px;margin-top:20px}
.box p{margin:0 0 .5em}
.big-say{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.7rem);line-height:1.12;letter-spacing:-.02em;max-width:24ch;margin:0 0 .6em}
ul.plain{margin:0;padding-left:1.1em}
ul.plain li{margin-bottom:.35em}

@media (max-width:560px){
  .count{display:none}
  .pill span.long{display:none}
}
@media (prefers-reduced-motion:reduce){
  .chip,.shake{animation:none}
  .fill,.below .hid{transition:none}
}
</style>
</head>
<body>
<div class="deck">
<main class="stage" id="stage">

<!-- 1. Cím -->
<section class="slide" aria-label="Cím">
  <div class="slide-inner hero">
    <div>
      <h1 tabindex="-1">Mi zajlik a fejedben?</h1>
      <p class="lead">Bevezetés a pszichológiába. Ma kísérletezünk, tippelünk, és kiderítjük, miért érdemes ezt a tantárgyat tanulni.</p>
      <button class="btn hot" data-next>Kezdjük</button>
      <aside class="notes"><b>Tanári jegyzet (kb. 2 perc).</b> Kérdezd meg a diákoktól: „Mivel foglalkozik szerintetek a pszichológia?” Írj fel 3–4 tippet a táblára, az óra végén visszatérünk rájuk. Billentyűk: nyilak, Home/End, N a jegyzetekhez.</aside>
    </div>
    <div class="cloud" aria-hidden="true">
      <span class="chip c1" style="--d:.05s;--r:-4deg;--s:1.7rem">figyelem</span>
      <span class="chip c5" style="--d:.15s;--r:3deg;--s:1.15rem">álmok</span>
      <span class="chip c2" style="--d:.25s;--r:-2deg;--s:1.4rem">emlékezet</span>
      <span class="chip c4" style="--d:.35s;--r:4deg;--s:1.9rem">érzelmek</span>
      <span class="chip c3" style="--d:.45s;--r:-3deg;--s:1.2rem">döntések</span>
      <span class="chip c5" style="--d:.55s;--r:2deg;--s:1.5rem">barátság</span>
      <span class="chip c1" style="--d:.65s;--r:-5deg;--s:1.15rem">stressz</span>
      <span class="chip c2" style="--d:.75s;--r:3deg;--s:1.7rem">tanulás</span>
      <span class="chip c4" style="--d:.85s;--r:-2deg;--s:1.2rem">személyiség</span>
      <span class="chip c3" style="--d:.95s;--r:2deg;--s:1.4rem">motiváció</span>
    </div>
  </div>
</section>

<!-- 2. Igaz vagy hamis -->
<section class="slide" aria-label="Igaz vagy hamis" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Igaz vagy hamis? Tippelj!</h2>
    <p class="lead">Négy állítás. Előbb döntsd el magadban (vagy szavazzatok kézfelnyújtással), és csak utána kattints.</p>
    <div class="grid two" id="tf"></div>
    <p class="score" id="tf-score" aria-live="polite"></p>
    <aside class="notes"><b>Tanári jegyzet (kb. 5 perc).</b> Előbb kérj kézfelnyújtást, aztán kattints. A cél nem a jó válasz, hanem az, hogy a diákok észrevegyék: a józan ész sokszor félrevisz, ezért kell a tudomány. Ha marad idő, kérdezd meg, honnan hallották a 10%-os mítoszt.</aside>
  </div>
</section>

<!-- 3. Stroop -->
<section class="slide" aria-label="Stroop-kísérlet" data-hook="stroop" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Kísérlet: a szín vagy a szó?</h2>
    <p class="status" id="st-status"></p>
    <div class="panel" id="st-box"></div>
    <div class="swatches" id="st-sw"></div>
    <aside class="notes"><b>Tanári jegyzet (kb. 6 perc).</b> Kivetítőn egy önkéntessel, vagy oszd meg a linket, és mindenki a saját telefonján próbálja ki. Utána beszéljétek meg: miért lassabb a második kör? (Az olvasás automatikus folyamat, a színnevezés nem.) Ez a Stroop-effektus, John Ridley Stroop írta le 1935-ben.</aside>
  </div>
</section>

<!-- 4. Mi a pszichológia -->
<section class="slide" aria-label="Mi a pszichológia?" hidden>
  <div class="slide-inner two-col">
    <div>
      <h2 tabindex="-1">Mi a pszichológia?</h2>
      <div class="ety">
        <div>psziché<small>görögül: lélek</small></div>
        <div>lógosz<small>görögül: tan, tudomány</small></div>
      </div>
      <p class="def">A viselkedés és a belső élmények tudományos vizsgálata.</p>
      <p class="lead">Amit mások látnak, az a viselkedés. Ami közben bennünk zajlik, az a gondolat, az érzés és az emlék. A pszichológia mindkettőt vizsgálja, és a kettő kapcsolatát is.</p>
      <aside class="notes"><b>Tanári jegyzet (kb. 4 perc).</b> Kérdezd meg: mit látsz kívülről valakiből, aki most ideges? Mit nem látsz? A „Merülj le” gombra kattintva kiderül a jéghegy víz alatti része. Hasonlítsd a táblára írt tippekhez.</aside>
    </div>
    <div class="water">
      <div class="above">
        <h3>A vízvonal fölött: amit látunk</h3>
        <div class="tags">
          <span class="tag">elpirul</span><span class="tag">hallgat</span><span class="tag">elkésik</span><span class="tag">nevet</span><span class="tag">felemeli a kezét</span>
        </div>
      </div>
      <div class="line-water"></div>
      <div class="below" id="below">
        <div class="hid" aria-hidden="false">
          <h3>A víz alatt: amit nem látunk</h3>
          <div class="tags">
            <span class="tag">gondolatok</span><span class="tag">félelmek</span><span class="tag">emlékek</span><span class="tag">vágyak</span><span class="tag">terveink</span><span class="tag">érzelmek</span>
          </div>
        </div>
        <div class="go"><button class="btn hot" id="dive">Merülj le</button></div>
      </div>
    </div>
  </div>
</section>

<!-- 5. Mivel foglalkozik -->
<section class="slide" aria-label="Mivel foglalkozik?" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Mivel foglalkozik? Kattints egy témára</h2>
    <p class="lead">Mindegyik mögött egy kérdés bújik, amit te is feltettél már magadnak.</p>
    <div class="grid">
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Figyelem</span><span class="hint">Kattints, és megkapod a kérdést</span></span><span class="back"><b>Figyelem</b>Miért nem vesszük észre, ami az orrunk előtt történik, ha valamire nagyon koncentrálunk?</span></button>

      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Kapcsolatok</span><span class="hint">Kattints, és megkapod a kérdést</span></span><span class="back"><b>Kapcsolatok</b>Miért igazodunk a csoporthoz, még ha nem is értünk egyet vele?</span></button>
    </div>
    <aside class="notes"><b>Tanári jegyzet (kb. 5 perc).</b> Nyisd ki az összes kártyát, majd szavazzatok kézfelnyújtással: melyik kérdés érdekel a legjobban? Jegyezd fel a táblára az eredményt. Ezek az év fő témái is lehetnek, igazítsd a saját tanmenetedhez.</aside>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var hooks={};
  var cur=0;
  var prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  var fill=document.getElementById('fill'), count=document.getElementById('count');

  function show(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    var pk=slides[cur].getAttribute('data-hook');
    if(pk&&hooks[pk]&&hooks[pk].leave) hooks[pk].leave();
    slides.forEach(function(s,k){ s.hidden=(k!==n); });
    cur=n;
    slides[cur].scrollTop=0;
    var h=slides[cur].querySelector('h1,h2');
    if(h&&n>0) h.focus({preventScroll:true});
    fill.style.width=((cur/(slides.length-1))*100)+'%';
    count.textContent=(cur+1)+' / '+slides.length;
    prevBtn.disabled=cur===0; nextBtn.disabled=cur===slides.length-1;
    var nk=slides[cur].getAttribute('data-hook');
    if(nk&&hooks[nk]&&hooks[nk].enter) hooks[nk].enter();
  }
  prevBtn.addEventListener('click',function(){show(cur-1)});
  nextBtn.addEventListener('click',function(){show(cur+1)});
  document.querySelectorAll('[data-next]').forEach(function(b){b.addEventListener('click',function(){show(cur+1)})});

  var notesBtn=document.getElementById('notes-btn');
  function toggleNotes(){
    var on=document.body.classList.toggle('notes-on');
    notesBtn.setAttribute('aria-pressed',on);
  }
  notesBtn.addEventListener('click',toggleNotes);

  document.addEventListener('keydown',function(e){
    var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1)}
    else if(e.key==='Home'){show(0)}
    else if(e.key==='End'){show(slides.length-1)}
    else if(e.key==='n'||e.key==='N'){toggleNotes()}
  });

  var sx=0, sy=0, tracking=false;
  var stage=document.getElementById('stage');
  stage.addEventListener('touchstart',function(e){
    if(e.target.closest('button,a,input,textarea')){tracking=false;return}
    tracking=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ show(dx<0?cur+1:cur-1); }
  },{passive:true});

  /* flip cards */
  document.querySelectorAll('.flip').forEach(function(b){
    b.addEventListener('click',function(){
      var o=b.classList.toggle('is-open');
      b.setAttribute('aria-expanded',o?'true':'false');
    });
  });

  /* ---- 2. Igaz / hamis ---- */
  (function(){
    var data=[
      {t:'Az agyunknak csak a 10%-át használjuk.',a:false,e:'Képalkotó vizsgálatok szerint gyakorlatilag az egész agyunk aktív, még alvás közben is. A 10%-os szám csak egy makacs mítosz.'},
      {t:'Az alváshiány rontja a tanulást és a hangulatot is.',a:true,e:'Kialvatlanul nehezebb figyelni, gyengébb az emlékezet, és hamarabb borulunk ki.'},
      {t:'Tudunk két dologra egyszerre jól figyelni, például tanulni és közben üzenetet írni.',a:false,e:'Az agyunk általában nem párhuzamosan dolgozik, hanem gyorsan váltogat a feladatok között. Ez lassít, és több hibához vezet.'},
      {t:'Ha megnevezzük, mit érzünk, attól az érzés kevésbé lehet erős.',a:true,e:'Kutatások szerint már az is csökkentheti az érzelem erősségét, ha szavakba öntjük: „ideges vagyok”.'}
    ];
    var wrap=document.getElementById('tf'), scoreEl=document.getElementById('tf-score');
    var score=0, done=0;
    function build(){
      wrap.innerHTML=''; score=0; done=0; scoreEl.innerHTML='';
      data.forEach(function(d){
        var el=document.createElement('div'); el.className='stmt';
        el.innerHTML='<p class="stmt-t">'+d.t+'</p><div class="ans"><button class="btn ghost" data-v="1">Igaz</button><button class="btn ghost" data-v="0">Hamis</button></div><p class="fb" hidden></p>';
        var btns=[].slice.call(el.querySelectorAll('button')), fb=el.querySelector('.fb');
        btns.forEach(function(b){
          b.addEventListener('click',function(){
            var v=b.getAttribute('data-v')==='1', ok=(v===d.a);
            el.classList.add(ok?'ok':'no');
            btns.forEach(function(x){x.disabled=true}); b.classList.add('picked');
            fb.hidden=false;
            fb.innerHTML='<strong>'+(ok?'Jól tippeltél.':'Ez most nem jött be.')+'</strong> '+(d.a?'Igaz. ':'Hamis. ')+d.e;
            done++; if(ok) score++;
            if(done<data.length){ scoreEl.textContent=score+' találat eddig'; }
            else {
              scoreEl.innerHTML='Végeredmény: '+score+' a '+data.length+'-ből. Nem baj, ha tévedtél: a józan ész sokszor félrevisz, ezért kell a tudomány. <button class="btn ghost" id="tf-again" style="margin-left:8px">Újra</button>';
              document.getElementById('tf-again').addEventListener('click',build);
            }
          });
        });
        wrap.appendChild(el);
      });
    }
    build();
  })();

  /* ---- 3. Stroop ---- */
  (function(){
    var C=[{n:'piros',w:'PIROS',c:'#FF4D5E'},{n:'kék',w:'KÉK',c:'#4C8DFF'},{n:'zöld',w:'ZÖLD',c:'#2ED47A'},{n:'sárga',w:'SÁRGA',c:'#FFD23F'}];
    var box=document.getElementById('st-box'), sw=document.getElementById('st-sw'), status=document.getElementById('st-status');
    var N=6, phase=0, trial=0, t0=0, active=false, errors=0, times=[[],[]], seq=[], timer=null;
    sw.innerHTML=C.map(function(c,k){return '<button class="sw" data-k="'+k+'" disabled><span class="dot" style="background:'+c.c+'"></span><span class="lab">'+c.n+'</span></button>'}).join('');
    var btns=[].slice.call(sw.querySelectorAll('button'));
    function enable(v){active=v; btns.forEach(function(b){b.disabled=!v})}
    function msg(html){box.innerHTML='<div class="st-msg">'+html+'</div>'}
    function mean(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
    function make(cong){
      var s=[], prev=-1;
      for(var k=0;k<N;k++){
        var w; do{w=Math.floor(Math.random()*4)}while(w===prev); prev=w;
        var ink=w; if(!cong){ do{ink=Math.floor(Math.random()*4)}while(ink===w); }
        s.push({w:w,ink:ink});
      }
      return s;
    }
    function intro(){
      clearTimeout(timer); enable(false); errors=0; times=[[],[]]; status.textContent='';
      msg('<p>Két kör lesz, körönként hat szó. Kattints arra a színre, amilyen színnel a szó <strong>írva van</strong>. Válaszolj gyorsan, de ne hibázz.</p><button class="btn hot" id="st-go">Indítás</button>');
      document.getElementById('st-go').addEventListener('click',function(){run(0)});
    }
    function run(p){ phase=p; seq=make(p===0); trial=0; status.textContent=(p+1)+'. kör'; next(); }
    function next(){
      if(trial>=N){ enable(false); if(phase===0) between(); else results(); return; }
      var s=seq[trial];
      box.innerHTML='<div class="st-word" style="color:'+C[s.ink].c+'">'+C[s.w].w+'</div>';
      t0=performance.now(); enable(true);
    }
    function between(){
      status.textContent='';
      msg('<p><strong>Az 1. kör kész.</strong> Most jön a nehezebb: a szavak megtévesztők lesznek. A szabály ugyanaz: a betűk színére kattints, ne a szó jelentésére.</p><button class="btn hot" id="st-go2">2. kör</button>');
      document.getElementById('st-go2').addEventListener('click',function(){run(1)});
    }
    function results(){
      var a=mean(times[0]), b=mean(times[1]), text;
      status.textContent='Kész';
      if(b>a){ text='A második körben átlagosan '+(b-a)+' ms-mal lassabb voltál. Ez a Stroop-effektus: az olvasás annyira automatikus, hogy a szó jelentése akkor is beleszól, amikor nem kérjük.'; }
      else { text='Nálad most nem lett lassabb a második kör. Ilyen is előfordul: kevés próbánál sokat számít a véletlen, ezért ismétlik a kutatók sokszor a méréseket. A jelenség lényege: az olvasás automatikus, a színnevezés nem.'; }
      msg('<div class="res"><div><b>'+a+' ms</b><span>a szó és a szín egyezett</span></div><div><b>'+b+' ms</b><span>a szó és a szín nem egyezett</span></div></div><p>'+text+'</p><p class="small" style="color:#C7CAF0">Hibás kattintások: '+errors+'</p><button class="btn light" id="st-again">Újra</button>');
      document.getElementById('st-again').addEventListener('click',intro);

      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Időtartam</span><span class="hint">Kattints a példáért</span></span><span class="back"><b>Időtartam</b>Meddig tart az inger. Egy villanás és egy folyamatos fény ugyanazt a receptort ingerli, de más időtartamban.</span></button>
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Térbeli és időbeli jellemzők</span><span class="hint">Kattints a példáért</span></span><span class="back"><b>Térbeli-időbeli jellemzők</b>Honnan érkezik az inger, és hogyan változik időben – ez segít lokalizálni pl. egy hangforrást, vagy érzékelni a mozgást.</span></button>
    </div>
    <aside class="notes"><b>Tanári jegyzet (kb. 3 perc).</b> Kérj a diákoktól saját példát mind a négyre – pl. „Mondj egy inger­párt, ami csak intenzitásban különbözik.”</aside>
  </div>

<!-- 5. Osztályozás -->
<section class="slide" aria-label="Érzékszervek osztályozása" hidden>

    <div class="grid">
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Exteroceptív</span><span class="hint">A külvilágról szól</span></span><span class="back"><b>Exteroceptív</b>Látás, hallás, szaglás, ízlelés, tapintás – a külső világ ingereit érzékelik.</span></button>
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Proprioceptív</span><span class="hint">A testhelyzetről szól</span></span><span class="back"><b>Proprioceptív</b>Az izmokból és ízületekből érkező jelek, amelyek megmondják, hol van a testrészed – ezért tudod csukott szemmel is megérinteni az orrod.</span></button>
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Interoceptív</span><span class="hint">A belső szervekről szól</span></span><span class="back"><b>Interoceptív</b>A belső szervekből jövő jelek: éhség, szomjúság, teli hólyag, szívverés – ezek is érzékelések, csak ritkán gondolunk rájuk így.</span></button>
    </div>
    <div class="box">
      <p>Van egy negyedik, kevésbé ismert is: a <strong>vestibuláris (egyensúly-) érzékelés</strong> a belső fülben, ami megmondja, merre "lent" a lent, és mikor forogsz.</p>

  </div>

<!-- 6. Abszolút küszöb -->

      <div class="card"><h3>A másik irány: érzékenyítés</h3><p>Van ennek az ellentéte is: <strong>sensibilizare (érzékenyítés)</strong>, amikor egy gyenge inger felerősíti egy másik érzékelését – pl. egy halk zaj sötétben ijesztőbbnek tűnik, mint fényes nappal.</p></div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var cur=0;
  var prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  var fill=document.getElementById('fill'), count=document.getElementById('count');

  function show(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(s,k){ s.hidden=(k!==n); });
    cur=n;
    slides[cur].scrollTop=0;
    var h=slides[cur].querySelector('h1,h2');
    if(h&&n>0) h.focus({preventScroll:true});
    fill.style.width=((cur/(slides.length-1))*100)+'%';
    count.textContent=(cur+1)+' / '+slides.length;
    prevBtn.disabled=cur===0; nextBtn.disabled=cur===slides.length-1;
  }
  prevBtn.addEventListener('click',function(){show(cur-1)});
  nextBtn.addEventListener('click',function(){show(cur+1)});
  document.querySelectorAll('[data-next]').forEach(function(b){b.addEventListener('click',function(){show(cur+1)})});

  var notesBtn=document.getElementById('notes-btn');
  notesBtn.addEventListener('click',function(){
    var on=document.body.classList.toggle('notes-on');
    notesBtn.setAttribute('aria-pressed',on);
  });

  document.addEventListener('keydown',function(e){
    var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1)}
    else if(e.key==='Home'){show(0)}
    else if(e.key==='End'){show(slides.length-1)}
    else if(e.key==='n'||e.key==='N'){notesBtn.click()}
  });

  var sx=0, sy=0, tracking=false;
  var stage=document.getElementById('stage');
  stage.addEventListener('touchstart',function(e){
    if(e.target.closest('button,a,input,textarea')){tracking=false;return}
    tracking=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ show(dx<0?cur+1:cur-1); }
  },{passive:true});

  document.querySelectorAll('.flip').forEach(function(b){
    b.addEventListener('click',function(){
      var o=b.classList.toggle('is-open');
      b.setAttribute('aria-expanded',o?'true':'false');

  });

  (function(){

      a:'Most a bal-alsó lap tűnik elöl lévőnek – mintha egy dobozba néznél lefelé.',
      b:'Most a felső lap tűnik elöl lévőnek – mintha egy dobozra néznél felülről.',
      c:'Most a jobb oldali lap tűnik elöl lévőnek – próbáld megint másképp nézni!'

      f.addEventListener('click',function(){
        faces.forEach(function(x){x.style.fill='';});
        var face=f.getAttribute('data-face');
        f.style.fill='#FFC533';
        msg.textContent=texts[face];
      });
    });
    document.getElementById('cube-explain').addEventListener('click',function(){
      document.getElementById('cube-answer').hidden=false;
    });
  })();

  /* ---- ingerlánc ---- */
  (function(){
    var steps=[].slice.call(document.querySelectorAll('#chain .step'));
    var arrows=[].slice.call(document.querySelectorAll('#chain .arrow'));
    var desc=document.getElementById('chain-desc');
    var texts=[
      'Egy fizikai energia éri a testet: fényhullám, hanghullám, illatmolekula, nyomás.',

      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Zártság</span><span class="hint">Kattints a magyarázatért (részletesen a következő dián)</span></span><span class="back"><b>Zártság (closure)</b>A hiányos, megszakított alakzatokat is teljesnek, zártnak érzékeljük – az agyunk "kitölti" a hiányzó részeket.</span></button>
      <button class="flip" aria-expanded="false"><span class="front"><span class="t">Alak-háttér</span><span class="hint">Kattints a magyarázatért (részletesen a következő dián)</span></span><span class="back"><b>Alak-háttér (figure-ground)</b>Mindig elkülönítünk egy "alakot", ami kiemelkedik, és egy "hátteret", ami mögötte marad – néha a kettő felcserélhető.</span></button>
    </div>
  </div>
</section>

<!-- 5. Zártság - dashed triangle -->
<section class="slide" aria-label="Zártság" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Zártság: a hiányból is egészet látunk</h2>
    <p class="lead">Nézd meg az ábrát – pedig a vonal nagy része hiányzik.</p>
    <div class="closure-wrap">
      <svg class="closure-svg" width="320" height="280" viewBox="0 0 320 280">
        <path id="closure-path" d="M160,30 L290,240 L30,240 Z" fill="none" stroke="#16163A" stroke-width="6" stroke-linejoin="round" stroke-dasharray="18 16"/>
      </svg>
      <button class="btn ghost" id="closure-btn">Mutasd folytonos vonallal</button>
      <p class="box">Valójában a kontúr nagy része <strong>nincs is megrajzolva</strong> – csak szaggatott vonaldarabkák vannak ott. Az agyad mégis egy teljes, zárt háromszöget "lát", mert a <strong>zártság elve</strong> alapján automatikusan kitölti a hézagokat. Ugyanez történik, amikor felismersz egy szót részben eltakart felirat esetén is.</p>
    </div>
  </div>
</section>

<!-- 6. Alak-háttér - Rubin váza -->
<section class="slide" aria-label="Alak-háttér" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Váza, vagy két egymással szemben néző arc?</h2>
    <p class="lead">Nézd meg az ábrát: az egyik pillanatban az egyik olvasat "ugrik be", aztán a másik. Kattints arra, amit most éppen látsz.</p>
    <div class="rubin-wrap">
      <svg width="300" height="250" viewBox="0 0 300 250" aria-hidden="true">
        <path fill="#16163A" d="M150,15 Q185,20 190,45 Q193,60 178,75 Q210,85 205,100 Q185,108 183,115 Q200,122 195,132 Q175,145 172,160 Q170,190 205,210 Q210,225 150,235 Q90,225 95,210 Q130,190 128,160 Q125,145 105,132 Q100,122 117,115 Q115,108 95,100 Q90,85 122,75 Q107,60 110,45 Q115,20 150,15 Z"/>
      </svg>
      <div style="max-width:320px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <button class="btn ghost" data-see="vase">Én egy vázát látok</button>
          <button class="btn ghost" data-see="faces">Én két arcot látok</button>
        </div>
        <p class="box" id="rubin-answer" hidden>Mindkét válasz helyes – ez egy <strong>kétértelmű alak-háttér ábra</strong>. Ha a sötét részt tekinted "alaknak", vázát látsz; ha a fehér részeket, két egymással szemben néző profilt. Ugyanaz az ábra (érzékelés), de az agyad csak az egyik olvasatot tudja egyszerre "alaknak" látni (észlelés).</p>
      </div>
    </div>
  </div>
</section>

<!-- 7. Percepciós állandóság -->
<section class="slide" aria-label="Percepciós állandóság" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Ugyanaz az ajtó – teljesen más alakú retinakép</h2>
    <p class="lead">Kattints a gombra, és nézd meg, ahogy az ajtó nyílik. Figyeld meg: a retinádra eső <em>alak</em> drámaian változik.</p>
    <div class="door-wrap">
      <svg id="door-svg" width="260" height="220" viewBox="0 0 260 220">
        <rect x="20" y="20" width="120" height="180" fill="#D9DEFF" stroke="#16163A" stroke-width="4"/>
        <circle cx="120" cy="112" r="5" fill="#16163A"/>
      </svg>
      <p class="door-caption" id="door-caption">Csukott ajtó: téglalap alakú retinakép.</p>
      <button class="btn hot" id="door-next">Nyisd tovább az ajtót</button>
    </div>
    <div class="box">
      <p>Ez a <strong>percepciós állandóság (alakállandóság)</strong>: annak ellenére, hogy a retinádon egyre keskenyebb, torzabb alak jelenik meg, végig ugyanazt a téglalap alakú ajtót <em>észleled</em> – a tudásod és a tapasztalatod "kijavítja" a nyers képet.</p>
    </div>
  </div>
</section>

<!-- 8. Mélységészlelés -->
<section class="slide" aria-label="Mélységészlelés" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Honnan tudod, mi van közelebb?</h2>
    <p class="lead">A retinaképed lapos (2D), mégis mélységet észlelsz. Kattints a jelzőkre, és nézd meg, mely részletek segítenek ebben.</p>
    <svg width="100%" height="220" viewBox="0 0 500 220" preserveAspectRatio="xMidYMid meet">
      <rect width="500" height="220" fill="#EEF0FF"/>
      <g id="depth-persp" class="depth-dim">
        <line x1="250" y1="70" x2="20" y2="220" stroke="#16163A" stroke-width="3"/>
        <line x1="250" y1="70" x2="480" y2="220" stroke="#16163A" stroke-width="3"/>
      </g>
      <g id="depth-overlap" class="depth-dim">
        <path d="M150,150 Q210,90 270,150 Z" fill="#3550F5"/>
        <path d="M210,160 Q270,110 330,160 Z" fill="#0B7F72"/>
      </g>
      <g id="depth-size" class="depth-dim">
        <circle cx="60" cy="190" r="16" fill="#D42A68"/>
        <circle cx="440" cy="120" r="5" fill="#D42A68"/>
      </g>
    </svg>
    <div class="depth-btns" id="depth-btns">
      <button data-g="depth-persp" aria-pressed="false">Perspektíva</button>
      <button data-g="depth-overlap" aria-pressed="false">Takarás</button>
      <button data-g="depth-size" aria-pressed="false">Relatív méret</button>
    </div>
    <p class="depth-desc" id="depth-desc">Kattints egy gombra a jelzőkör kiemeléséhez.</p>
    <aside class="notes"><b>Tanári jegyzet (kb. 3 perc).</b> Ezek monokuláris (fél szemmel is működő) mélységjelzők. Említsd meg, hogy két szemmel (binokuláris látással) további jelzők is segítenek, pl. a két retinakép közti apró eltérés (sztereopszis).</aside>
  </div>
</section>

<!-- 9. Pareidolia -->
<section class="slide" aria-label="Pareidolia" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Látsz benne arcot?</h2>
    <p class="lead">Ez a forma teljesen véletlenszerű – mégis, szinte lehetetlen nem arcot látni benne.</p>
    <div class="blob-wrap">
      <svg width="220" height="200" viewBox="0 0 220 200">
        <path d="M110,10 C170,10 205,55 200,100 C196,140 175,175 130,190 C90,202 40,185 20,145 C2,108 15,55 55,25 C72,13 90,10 110,10 Z" fill="#D9DEFF" stroke="#16163A" stroke-width="3"/>
        <circle cx="80" cy="85" r="11" fill="#16163A"/>
        <circle cx="145" cy="80" r="11" fill="#16163A"/>
        <path d="M75,135 Q112,160 150,130" fill="none" stroke="#16163A" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div style="max-width:340px">
        <p class="box">Ez a jelenség a <strong>pareidolia</strong>: az agyunk annyira "rá van hangolva" az arcfelismerésre, hogy véletlenszerű foltokban, felhőkben, konnektorokban is arcokat vél felfedezni. Ez is <strong>percepciós készenlét</strong>: elvárásaink és korábbi tapasztalataink alapján aktívan "keresünk" bizonyos mintázatokat, még ott is, ahol nincsenek szándékosan elhelyezve.</p>
      </div>
    </div>
  </div>
</section>

<!-- 10. Igaz/hamis kvíz -->
<section class="slide" aria-label="Igaz vagy hamis" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Igaz vagy hamis? Érzékelés és észlelés</h2>
    <div class="grid two" id="tf-quiz"></div>
  </div>
</section>

<!-- 11. Záró -->
<section class="slide" aria-label="Összegzés" hidden>
  <div class="slide-inner">
    <h2 tabindex="-1">Amit ma megtanultunk</h2>
    <p class="big-say">Az érzékelés a nyersanyag, az észlelés az, amit ebből az agyunk épít: szervez, kiegészít és jelentéssel lát el.</p>
    <div class="grid two">
      <div class="card">
        <h3>Kilépőjegy (füzetbe, 2 perc)</h3>
        <ul class="plain">
          <li>Egy dolog, ami ma meglepett.</li>
          <li>Melyik Gestalt-elvre emlékszel a legjobban?</li>
          <li>Egy kérdés, amit még feltennél a témáról.</li>
        </ul>
      </div>
      <div class="card">
        <h3>Házi feladat</h3>
        <p>Keress otthon vagy az utcán egy példát a percepciós állandóságra vagy egy alak-háttér helyzetre (pl. egy mintás tárgyon). Írd le 3–4 mondatban, mit figyeltél meg.</p>
      </div>
    </div>
  </div>
</section>

</main>

  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <span class="count" id="count">1 / 11</span>
  <button class="pill" id="notes-btn" aria-pressed="false">Jegyzetek</button>
  <button class="nav" id="next" aria-label="Következő dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
</div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var cur=0;
  var prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
  var fill=document.getElementById('fill'), count=document.getElementById('count');

  function show(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(s,k){ s.hidden=(k!==n); });
    cur=n;
    slides[cur].scrollTop=0;
    var h=slides[cur].querySelector('h1,h2');
    if(h&&n>0) h.focus({preventScroll:true});
    fill.style.width=((cur/(slides.length-1))*100)+'%';
    count.textContent=(cur+1)+' / '+slides.length;
    prevBtn.disabled=cur===0; nextBtn.disabled=cur===slides.length-1;
  }
  prevBtn.addEventListener('click',function(){show(cur-1)});
  nextBtn.addEventListener('click',function(){show(cur+1)});
  document.querySelectorAll('[data-next]').forEach(function(b){b.addEventListener('click',function(){show(cur+1)})});

  var notesBtn=document.getElementById('notes-btn');
  notesBtn.addEventListener('click',function(){
    var on=document.body.classList.toggle('notes-on');
    notesBtn.setAttribute('aria-pressed',on);
  });

  document.addEventListener('keydown',function(e){
    var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1)}
    else if(e.key==='Home'){show(0)}
    else if(e.key==='End'){show(slides.length-1)}
    else if(e.key==='n'||e.key==='N'){notesBtn.click()}
  });

  var sx=0, sy=0, tracking=false;
  var stage=document.getElementById('stage');
  stage.addEventListener('touchstart',function(e){
    if(e.target.closest('button,a,input,textarea')){tracking=false;return}
    tracking=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false;
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ show(dx<0?cur+1:cur-1); }
  },{passive:true});

  document.querySelectorAll('.flip').forEach(function(b){
    b.addEventListener('click',function(){
      var o=b.classList.toggle('is-open');
      b.setAttribute('aria-expanded',o?'true':'false');
    });
  });

  /* ---- duplikált szó ---- */
  document.getElementById('word-btn').addEventListener('click',function(){
    document.getElementById('word-answer').hidden=false;
  });

  /* ---- zártság ---- */
  document.getElementById('closure-btn').addEventListener('click',function(){
    var p=document.getElementById('closure-path');
    var dashed = p.getAttribute('stroke-dasharray') !== 'none';
    p.setAttribute('stroke-dasharray', dashed ? 'none' : '18 16');
    this.textContent = dashed ? 'Mutasd szaggatva' : 'Mutasd folytonos vonallal';
  });

  /* ---- rubin váza ---- */
  document.querySelectorAll('[data-see]').forEach(function(b){
    b.addEventListener('click',function(){ document.getElementById('rubin-answer').hidden=false; });
  });

  /* ---- ajtó / alakállandóság ---- */
  (function(){
    var svg=document.getElementById('door-svg'), cap=document.getElementById('door-caption'), btn=document.getElementById('door-next');
    var states=[
      { html:'<rect x="20" y="20" width="120" height="180" fill="#D9DEFF" stroke="#16163A" stroke-width="4"/><circle cx="120" cy="112" r="5" fill="#16163A"/>', text:'Csukott ajtó: téglalap alakú retinakép.' },
      { html:'<polygon points="70,20 140,45 140,175 70,200" fill="#D9DEFF" stroke="#16163A" stroke-width="4"/><circle cx="132" cy="112" r="5" fill="#16163A"/>', text:'Félig nyitott ajtó: a retinakép már trapéz alakú.' },
      { html:'<rect x="128" y="20" width="14" height="180" fill="#D9DEFF" stroke="#16163A" stroke-width="4"/>', text:'Majdnem teljesen nyitva: a retinaképen már csak egy vékony csík látszik – mégis tudod, hogy ugyanaz a téglalap alakú ajtó.' }
    ];
    var i=0;
    btn.addEventListener('click',function(){
      i=(i+1)%states.length;
      svg.innerHTML=states[i].html;
      cap.textContent=states[i].text;
    });
  })();

  /* ---- mélységészlelés ---- */
  (function(){
    var btns=[].slice.call(document.querySelectorAll('#depth-btns button'));
    var groups={ 'depth-persp': document.getElementById('depth-persp'), 'depth-overlap': document.getElementById('depth-overlap'), 'depth-size': document.getElementById('depth-size') };
    var texts={
      'depth-persp':'Lineáris perspektíva: a párhuzamos vonalak a távolban egy pontba futnak össze – ez mélységet sugall.',
      'depth-overlap':'Takarás (interpozíció): amelyik forma eltakar egy másikat, azt közelebbinek észleljük.',
      'depth-size':'Relatív méret: az azonos méretű tárgyak közül a kisebbnek látszót messzebbinek észleljük.'
    };
    var desc=document.getElementById('depth-desc');
    btns.forEach(function(b){
      b.addEventListener('click',function(){
        btns.forEach(function(x){x.setAttribute('aria-pressed','false')});
        Object.keys(groups).forEach(function(k){ groups[k].setAttribute('class', k===b.getAttribute('data-g') ? 'depth-on' : 'depth-dim'); });
        b.setAttribute('aria-pressed','true');
        desc.textContent=texts[b.getAttribute('data-g')];
      });
    });
  })();

  /* ---- igaz/hamis ---- */
  (function(){
    var data=[
      { t:'Két ember, ugyanazt az ingert érzékelve, mindig pontosan ugyanazt észleli.', a:false,
        e:'Hamis. Az észlelést a tapasztalat, az elvárás, a figyelem és a kultúra is alakítja, ezért ugyanaz az inger két embernél különböző észlelést eredményezhet.' },
      { t:'A percepciós állandóság segít felismerni a tárgyakat változó szög vagy megvilágítás mellett is.', a:true,
        e:'Igaz. Az alak-, méret- és színállandóság nélkül minden apró szögváltozásnál újra kellene "tanulnunk" felismerni a már ismert tárgyakat.' },
      { t:'Az optikai illúziók azt bizonyítják, hogy a szemünk rosszul működik.', a:false,
        e:'Hamis. Az illúziók nem a szem hibái, hanem azt mutatják meg, hogyan szervezi és értelmezi az agyunk az ingereket – ez az észlelés, nem az érzékelés szintjén történik.' }
    ];
    var wrap=document.getElementById('tf-quiz');
    data.forEach(function(d){
      var el=document.createElement('div'); el.className='stmt';
      el.innerHTML='<p class="stmt-t">'+d.t+'</p><div class="ans"><button class="btn ghost" data-v="1">Igaz</button><button class="btn ghost" data-v="0">Hamis</button></div><p class="fb" hidden></p>';
      var btns=[].slice.call(el.querySelectorAll('button')), fb=el.querySelector('.fb');
      btns.forEach(function(b){
        b.addEventListener('click',function(){
          var v=b.getAttribute('data-v')==='1', ok=(v===d.a);
          el.classList.add(ok?'ok':'no');
          btns.forEach(function(x){x.disabled=true});
          fb.hidden=false;
          fb.innerHTML='<strong>'+(ok?'Jól tippeltél.':'Ez most nem jött be.')+'</strong> '+d.e;
        });
      });
      wrap.appendChild(el);
    });
  })();

  show(0);
})();
<\/script>
</body>
</html>
`
};

const home = document.getElementById('home');
const wrap = document.getElementById('lessonwrap');
const frame = document.getElementById('lessonframe');
const backbtn = document.getElementById('backbtn');

document.querySelectorAll('[data-lesson]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-lesson');
    frame.srcdoc = LESSONS[key];
    home.hidden = true;
    wrap.hidden = false;
  });
});

backbtn.addEventListener('click', () => {
  wrap.hidden = true;
  home.hidden = false;
  frame.srcdoc = '';
});
</script>
</body>
</html>
